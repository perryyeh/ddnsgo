services:
  ddns-go:
    image: jeessy/ddns-go:latest
    container_name: ddnsgo
    hostname: ddnsgo
    restart: always
    networks:
      macvlan:
        ipv4_address: ${ipv4}
        ipv6_address: ${ipv6}
        mac_address: ${macaddress}
        driver_opts:
          com.docker.network.endpoint.sysctls: net.ipv6.conf.IFNAME.accept_ra_rt_info_max_plen=128
    volumes:
      - ./:/root

networks:
  macvlan:
    external: true
    name: ${MACVLAN_NET}
